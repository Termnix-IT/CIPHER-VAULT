# The CIPHER VAULT desktop app. See docs/開発・配布手順.md.
[workspace]
resolver = "3"
members = ["apps/desktop", "crates/vault-core"]

# scrypt with N=2^17 takes far too long without optimization, so dependencies are always optimized.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
