[package]
name = "cipher-vault-tauri-poc"
version = "0.0.0"
edition = "2024"
publish = false
description = "Read-only prototype that runs the existing React UI on Tauri. Not a release of CIPHER VAULT."

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cipher-vault-crypto-compat = { path = "../rust-crypto-compat" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
# custom-protocol serves the embedded web build, so the Tauri CLI is not needed.
tauri = { version = "2.12", features = ["custom-protocol"] }
uuid = { version = "1", features = ["v4"] }
# The same versions Tauri already uses. A mismatch would not compile against its webview handle.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
# The clipboard tests run in their own window station, and the policy test writes a temporary key.
windows = { version = "0.62", features = ["Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Threading"] }

[features]
# Automated UI checks only: debugging port, fake clipboard, events on stdout. Never distribute it.
e2e = []

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true

# A standalone crate: never joins a parent workspace.
[workspace]
