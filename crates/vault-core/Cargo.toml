[package]
name = "cipher-vault-core"
version = "0.0.0"
edition = "2024"
publish = false
description = "The CIPHER VAULT core for the Rust app. It has no Tauri dependency, so it can be tested without a window."

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.23"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
scrypt = { version = "0.12", default-features = false }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
zeroize = "1"
