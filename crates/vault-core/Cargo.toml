[package]
name = "cipher-vault-core"
version = "0.0.0"
edition = "2024"
publish = false
description = "The CIPHER VAULT core for the Rust app: formats, storage, sessions and the vault services. It has no Tauri dependency, so it can be tested without a window."

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
scrypt = { version = "0.12", default-features = false }
# Keeps object keys in the order written, as JSON.stringify does.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# File identity (volume, index, link count) for the same path checks the TypeScript services make.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
