name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  web:
    name: Screen (React)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Screen session rules, CSP and bundled fonts
        run: npm run test:web

  rust:
    name: Rust app (Tauri)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # The Tauri build embeds this screen, so it must exist before Cargo compiles the app.
      - name: Build the screen
        run: npm run build:web
      - name: Rust workspace tests
        run: cargo test --workspace --locked
      - name: Shell window, CSP and vault through the screen
        run: |
          cargo build -p cipher-vault --features e2e --locked
          node scripts/verify-tauri-shell.mjs target/debug/cipher-vault.exe "$env:RUNNER_TEMP\tauri-shell"

  dependencies:
    name: Dependency audit
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      # Audit the lockfile without running dependency install scripts.
      - name: Reject dependency findings except documented, expiring exceptions
        run: node scripts/audit-dependencies.mjs
