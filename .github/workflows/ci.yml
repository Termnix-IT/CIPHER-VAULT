name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  regression:
    name: Windows regression
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build desktop once for all regression tests
        run: npm run build:desktop
      - name: Renderer boundaries
        run: node --test tests/renderer-security.test.mjs tests/renderer-hardening.test.mjs
      - name: API, storage and Web packaging
        run: node scripts/run-api-tests.mjs
      - name: Session, KDF, input and clipboard contracts
        run: node --import tsx --test tests/vault-session.test.mjs tests/web-session.test.mjs tests/vault-lifecycle.test.mjs tests/vault-kdf.test.mjs tests/input-validation.test.mjs tests/expiring-clipboard.test.mjs tests/desktop-platform.test.mjs
      - name: Manual updater
        run: node --test tests/manual-updater.test.mjs
      - name: Built desktop integration
        run: node scripts/run-desktop-tests.mjs
      - name: Migrated v2 desktop integration
        run: node scripts/run-desktop-tests.mjs --v2
      - name: Login, API key and card desktop integration
        run: node scripts/run-desktop-tests.mjs --item-types
      - name: Interrupted vault recovery integration
        run: node scripts/run-desktop-tests.mjs --maintenance
      - name: Vite desktop integration and HMR
        run: node scripts/run-desktop-tests.mjs --dev
      - name: Production HTTP policy integration
        run: node scripts/run-desktop-tests.mjs --web

  desktop-package:
    name: Windows desktop package
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Package inclusion contracts
        run: npm run test:packaging-contract
      - name: Build the unpacked Windows application without publishing
        run: npm run build:desktop && node node_modules/electron-builder/cli.js --win --dir --publish never
      - name: Packaged sandbox, migration, restart and key cleanup
        run: npm run test:desktop-package

  rust:
    name: Rust app (Tauri)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # The Tauri build embeds this screen, so it must exist before Cargo compiles the app.
      - name: Build the screen with the Tauri CSP
        run: npm run build:web:tauri
      - name: Rust workspace tests
        run: cargo test --workspace --locked
      - name: Shell window, CSP and IPC
        run: |
          cargo build -p cipher-vault --features e2e --locked
          node scripts/verify-tauri-shell.mjs target/debug/cipher-vault.exe "$env:RUNNER_TEMP\tauri-shell"

  dependencies:
    name: Dependency audit
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      # Audit the lockfile without running dependency install scripts.
      - name: Reject dependency findings except documented, expiring exceptions
        run: node scripts/audit-dependencies.mjs
